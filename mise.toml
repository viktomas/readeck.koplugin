# Local development environment (not upstream). Everything it creates lives
# under references/, which is already gitignored.
[tools]
lua = "5.1"
stylua = "latest"

[env]
# busted/luacheck are installed into a project-local LuaRocks tree by the
# `setup` task below.
_.path = ["{{config_root}}/references/luarocks/bin"]
LUA_PATH = "{{config_root}}/references/luarocks/share/lua/5.1/?.lua;{{config_root}}/references/luarocks/share/lua/5.1/?/init.lua;;"
LUA_CPATH = "{{config_root}}/references/luarocks/lib/lua/5.1/?.so;;"
# Where the KOReader checkout used by the emulator smoke tests lives.
KOREADER_DIR = "{{config_root}}/references/koreader"

[tasks.setup]
description = "Install busted + luacheck into references/luarocks and link the KOReader checkout"
run = """
set -e
luarocks install --tree references/luarocks busted
luarocks install --tree references/luarocks luacheck
if [ ! -e references/koreader ]; then
    ln -s "$HOME/workspace/third-party/koreader" references/koreader
fi
echo "busted:   $(busted --version)"
echo "luacheck: $(luacheck --version | head -1)"
echo "stylua:   $(stylua --version)"
"""

[tasks.test]
description = "Run the busted spec suite"
run = "busted spec"

[tasks.lint]
description = "luacheck the plugin, specs and e2e suite"
run = "luacheck readeck.koplugin/main.lua readeck.koplugin/_meta.lua readeck.koplugin/readeck spec e2e"

[tasks.format]
run = "stylua readeck.koplugin/main.lua readeck.koplugin/_meta.lua readeck.koplugin/readeck spec e2e"

[tasks.format-check]
run = "stylua --check readeck.koplugin/main.lua readeck.koplugin/_meta.lua readeck.koplugin/readeck spec e2e"

[tasks.check]
description = "lint + format-check + test"
depends = ["lint", "format-check", "test"]

[tasks.e2e]
description = "Headless end-to-end suite: real plugin in a real KOReader runtime against a disposable LOCAL Readeck (e2e/README.md). Args: [-k test-name] [file-filter...]; env KOREADER_BUILD_DIR, READECK_VERSIONS"
run = "e2e/run.sh"

[tasks.e2e-server]
description = "Start a disposable local Readeck (port 18900, fixtures on 18901) with 3 seeded bookmarks and print its env; never touches a real server"
run = '''
set -e
unset READECK_URL READECK_TOKEN
python3 e2e/readeck_local.py start --port "${READECK_LOCAL_PORT:-18900}" >/dev/null
python3 e2e/readeck_local.py seed --count "${E2E_SEED_COUNT:-3}" >/dev/null
echo '# Local Readeck is running. Use it with: eval "$(python3 e2e/readeck_local.py env)"'
python3 e2e/readeck_local.py env
'''

[tasks.e2e-server-stop]
description = "Stop the local Readeck started by e2e-server"
run = "python3 e2e/readeck_local.py stop"

[tasks.readeck-build-local]
description = "Build the Readeck server from ../readeck (needs Go + Node) into ../readeck/dist/readeck; use it with READECK_BIN=../readeck/dist/readeck"
dir = "{{config_root}}/../readeck"
run = "make setup all && ./dist/readeck version"

[tasks.emulator-drive]
description = "Start the KOReader emulator under agent control (tools/kodrive; skill koreader-manual-testing) with a fresh profile and a disposable local Readeck on :18960"
run = "tools/kodrive start --fresh --seed 3"

[tasks.emulator-drive-stop]
description = "Stop the agent-driven emulator and its local Readeck"
run = "tools/kodrive stop --all"

[tasks.emulator-build]
description = "Build the KOReader emulator (long; needs the Homebrew deps from koreader/doc/Building.md)"
dir = "{{config_root}}"
run = """
set -e
cd references/koreader
export PATH="$(brew --prefix)/opt/findutils/libexec/gnubin:$(brew --prefix)/opt/gnu-getopt/bin:$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/opt/util-linux/bin:$PATH"
./kodev build
"""

[tasks.emulator-smoke]
description = "Run the plugin against a real KOReader runtime (needs emulator-build)"
run = """
set -e
BUILD_DIR="$(echo references/koreader/koreader-emulator-*/koreader | head -1)"
if [ ! -x "$BUILD_DIR/luajit" ]; then
    echo "No emulator build at $BUILD_DIR - run 'mise run emulator-build' first." >&2
    exit 1
fi
cd "$BUILD_DIR" && READECK_PLUGIN_DIR="{{config_root}}/readeck.koplugin" ./luajit "{{config_root}}/spec/koreader_runtime_probe.lua"
"""

[tasks.emulator-network-smoke]
description = "Drive the HTTP client against spec/mock_readeck_server.py inside the KOReader runtime"
run = """
set -e
BUILD_DIR="$(cd "$(echo references/koreader/koreader-emulator-*/koreader | head -1)" && pwd)"
run_probe() {
    python3 spec/mock_readeck_server.py --port "$2" --version "$1" &
    server_pid=$!
    sleep 0.5
    (cd "$BUILD_DIR" && READECK_PLUGIN_DIR="{{config_root}}/readeck.koplugin" \
        READECK_MOCK_URL="http://127.0.0.1:$2" READECK_EXPECT_VERSION="$1" \
        READECK_EXPECT_LEGACY="$3" ./luajit "{{config_root}}/spec/koreader_network_probe.lua")
    status=$?
    kill $server_pid 2>/dev/null || true
    wait $server_pid 2>/dev/null || true
    return $status
}
run_probe 0.22.2 18080 0
run_probe 0.21.6 18081 1
"""

[tasks.emulator-live-probe]
description = "READ-ONLY probe against a REAL Readeck server (needs emulator-build; uses READECK_URL/READECK_TOKEN or the emulator's seeded settings/readeck.lua). Never creates, modifies, archives, labels, deletes or annotates anything - only GETs and EPUB downloads to a temp dir."
run = """
set -e
BUILD_DIR="$(cd "$(echo references/koreader/koreader-emulator-*/koreader | head -1)" && pwd)"
if [ ! -x "$BUILD_DIR/luajit" ]; then
    echo "No emulator build at $BUILD_DIR - run 'mise run emulator-build' first." >&2
    exit 1
fi
cd "$BUILD_DIR" && READECK_PLUGIN_DIR="{{config_root}}/readeck.koplugin" \
    READECK_URL="$READECK_URL" READECK_TOKEN="$READECK_TOKEN" \
    READECK_SETTINGS_FILE="$BUILD_DIR/settings/readeck.lua" \
    ./luajit "{{config_root}}/spec/koreader_live_probe.lua"
"""

[tasks.emulator-live-probe-write]
description = """
OPT-IN WRITE MODE. If pointed at a real Readeck server (via READECK_URL/READECK_TOKEN) \
this task WRITES to it: it creates exactly ONE bookmark from a harmless public URL, \
exports and then updates one highlight on it via the plugin's real code paths, and \
deletes that same bookmark again before exiting. A runtime assertion refuses to touch \
any bookmark id other than the one this run created; if anything goes wrong partway \
through, cleanup still runs and the created id is printed loudly if it could not be \
deleted. Needs emulator-build. Do NOT point this at a real account without the \
account owner's explicit sign-off for this run - verify against \
spec/mock_readeck_server.py first (point READECK_URL at a running instance of it, \
any READECK_TOKEN value, the same way `mise run emulator-network-smoke` does).
"""
run = """
set -e
BUILD_DIR="$(cd "$(echo references/koreader/koreader-emulator-*/koreader | head -1)" && pwd)"
if [ ! -x "$BUILD_DIR/luajit" ]; then
    echo "No emulator build at $BUILD_DIR - run 'mise run emulator-build' first." >&2
    exit 1
fi
if [ -z "$READECK_URL" ] || [ -z "$READECK_TOKEN" ]; then
    echo "Set READECK_URL and READECK_TOKEN. This WRITES to whatever server READECK_URL points at." >&2
    exit 1
fi
cd "$BUILD_DIR" && READECK_PLUGIN_DIR="{{config_root}}/readeck.koplugin" \
    READECK_URL="$READECK_URL" READECK_TOKEN="$READECK_TOKEN" READECK_LIVE_WRITE=1 \
    ./luajit "{{config_root}}/spec/koreader_live_probe.lua"
"""

[tasks.emulator-live-probe-write-mock-smoke]
description = "Offline rehearsal of emulator-live-probe-write against spec/mock_readeck_server.py (no real server involved). Run this before ever pointing emulator-live-probe-write at a real account."
run = """
set -e
BUILD_DIR="$(cd "$(echo references/koreader/koreader-emulator-*/koreader | head -1)" && pwd)"
if [ ! -x "$BUILD_DIR/luajit" ]; then
    echo "No emulator build at $BUILD_DIR - run 'mise run emulator-build' first." >&2
    exit 1
fi
python3 spec/mock_readeck_server.py --port 18280 --version 0.23.4 --load-delay 0.5 &
server_pid=$!
sleep 0.5
(cd "$BUILD_DIR" && READECK_PLUGIN_DIR="{{config_root}}/readeck.koplugin" \
    READECK_URL="http://127.0.0.1:18280" READECK_TOKEN="mock-token" READECK_LIVE_WRITE=1 \
    ./luajit "{{config_root}}/spec/koreader_live_probe.lua")
status=$?
kill $server_pid 2>/dev/null || true
wait $server_pid 2>/dev/null || true
exit $status
"""

[tasks.emulator-seed]
description = "Write the emulator's readeck.lua settings from READECK_URL/READECK_TOKEN so you do not have to type a token into the emulator UI"
run = """
set -e
if [ -z "$READECK_URL" ] || [ -z "$READECK_TOKEN" ]; then
    echo "Set READECK_URL and READECK_TOKEN, e.g." >&2
    echo "  READECK_URL=http://n:8112 READECK_TOKEN=... mise run emulator-seed" >&2
    exit 1
fi
BUILD_DIR="$(echo references/koreader/koreader-emulator-*/koreader | head -1)"
DOWNLOAD_DIR="${READECK_DOWNLOAD_DIR:-$HOME/readeck-emulator-articles}"
mkdir -p "$DOWNLOAD_DIR" "$BUILD_DIR/settings"
cat > "$BUILD_DIR/settings/readeck.lua" <<LUA
-- Written by 'mise run emulator-seed'. Safe to delete.
return {
    ["readeck"] = {
        ["server_url"] = "$READECK_URL",
        ["auth_token"] = "$READECK_TOKEN",
        ["directory"] = "$DOWNLOAD_DIR/",
        ["log_level"] = "debug",
    },
}
LUA
echo "Seeded $BUILD_DIR/settings/readeck.lua"
echo "  server:    $READECK_URL"
echo "  downloads: $DOWNLOAD_DIR/"
"""

[tasks.emulator-run]
description = "Start the emulator with this plugin symlinked into its plugins dir"
run = """
set -e
BUILD_DIR="$(echo references/koreader/koreader-emulator-*/koreader | head -1)"
ln -sfn "{{config_root}}/readeck.koplugin" "$BUILD_DIR/plugins/readeck.koplugin"
cd references/koreader
# kodev parses its arguments with getopt(1); macOS ships a BSD getopt that it
# rejects outright ("unsupported getopt version"), so the Homebrew GNU tools
# have to come first on PATH exactly as they do for emulator-build.
export PATH="$(brew --prefix)/opt/gnu-getopt/bin:$(brew --prefix)/opt/findutils/libexec/gnubin:$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/opt/util-linux/bin:$PATH"
./kodev run
"""
